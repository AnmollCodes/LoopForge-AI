name: Dream Job Watcher — daily scan
#
# PRIVACY NOTE: this workflow commits data/matches.json and data/memory.json
# back to this repo on every run. Those files contain your drafted outreach
# notes, which include your name and profile highlights from config.json.
# If this repository is PUBLIC, that content becomes publicly visible in
# your git history. If you want to use this free-scheduling path with real
# personal data, make this repository private first.

on:
  schedule:
    # 08:00 UTC every day. Adjust the cron to your timezone preference.
    - cron: "0 8 * * *"
  workflow_dispatch: {} # lets you trigger a scan manually from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run the loop once
        run: npm run scan

      - name: Commit updated memory + matches
        run: |
          git config user.name "dream-job-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/memory.json data/matches.json
          git diff --cached --quiet || git commit -m "loop: scheduled scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
